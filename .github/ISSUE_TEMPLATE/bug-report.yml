name: Bug report
description: Report something that is not working as expected in GeoMaster
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear and short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Gameplay / questions
        - Scoring
        - User interface (JavaFX)
        - Database
        - Build / startup
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output / stack trace
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if they help explain the problem.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "21"
    validations:
      required: true
  - type: input
    id: javafx
    attributes:
      label: JavaFX version
      placeholder: "21.0.2"
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: SQLite 3.45